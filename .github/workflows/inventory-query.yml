name: LINE残席照会

on:
  workflow_dispatch:
    inputs:
      date:
        description: 確認日（YYYY-MM-DD）
        required: true
        type: string
      line_user_id:
        description: LINE返信先
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inventory-query-${{ inputs.line_user_id }}
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: 残席を確認してLINEへ返信
        env:
          QUERY_DATE: ${{ inputs.date }}
          LINE_USER_ID: ${{ inputs.line_user_id }}
          DRAGONS_LOGIN_ID: ${{ secrets.DRAGONS_LOGIN_ID }}
          DRAGONS_PASSWORD: ${{ secrets.DRAGONS_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: node watchers/dragons-ticket/query.mjs
